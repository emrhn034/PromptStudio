name: Windows sürümü
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PromptStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PromptStudio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm test
      - name: Etiket ve paket sürümünü doğrula
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Etiket package.json sürümüyle eşleşmiyor.' }
      - run: npm run dist -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PromptStudio/release/*.exe
            PromptStudio/release/*.blockmap
